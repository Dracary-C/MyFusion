# Copy this file to ../config.yml and edit local paths.

runtime:
  cuda_visible_devices: "0"
  tokenizers_parallelism: false

server:
  address: 0.0.0.0
  port: 8502

fusion:
  max_rounds: 2
  stop_on_reject: true
  extract_assessment_reasoning_hidden: true
  assessment_reasoning_max_new_tokens: 256
  resize: 256
  device: cuda
  rar_dtype: bf16
  sampling_mode: posterior

paths:
  input: /path/to/MyFusion/demo_sample/lowlight1.png
  output_dir: /path/to/MyFusion/outputs/tpgd_rar_run
  ui_output_root: /path/to/MyFusion/outputs/ui

  tpgd_options: ./myfusion/legacy/tpgdiff/universal-restoration/config/tpgd-sde/options/test_fast.yml
  tpgd_checkpoint: /path/to/latest_G.pth
  tpgd_prior: /path/to/tpgd_ViT-B-32.pt

  rar_config: ./myfusion/legacy/rar/configs/infer_cfg.yaml
  rar_assessment_config: ./myfusion/legacy/rar/iqa/config.yaml

commands:
  python: /path/to/conda/env/bin/python
  streamlit: /path/to/conda/env/bin/streamlit

ui:
  default_example: lowlight1
  max_rounds_slider_max: 10
